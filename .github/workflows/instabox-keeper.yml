name: instabox-keeper

# InstaBox 机器的「保活 + 定时轮转」。
#
# 保活：每次跑都续一个 activity lease（默认 1800 秒），平台就不会因为
#       「闲置 30 分钟」把机器挂起。
# 轮转：连续运行接近平台上限时（上限从 API 现取，免费号实测 120 分钟），
#       主动 suspend→resume 把计时清零，避开平台的强制挂起和 60~135 分钟冷却。
#
# 注意 GitHub 的 cron 不准（高峰延迟几分钟到十几分钟），lease 的 1800 秒
# 就是留给这个抖动的。cron-job.org 的 dispatch 是同一支 workflow，两条互不冲突。

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instabox-keeper
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    # 轮转要等暂停落地 + 保持 10 秒 + 恢复，留 20 分钟足够
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run keeper
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          MACHINE_ID: ${{ vars.INSTABOX_MACHINE_ID || 'm_agqz4ap54cjvki6u35bkkdauka' }}
          # 真实连续运行上限（8 小时）。API 的 maxRunMinutes 会阶梯式报小值
          # （实测 120 → 150 → 480），直接用会在 95 分钟就轮转，浪费额度。
          MAX_RUN_MINUTES: '480'
          # 留 20 分钟余量 -> 460 分钟轮转
          ROTATE_MARGIN_MIN: '20'
          LEASE_TTL: '1800'
        run: bash keeper.sh

      - name: Persist state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json 2>/dev/null)" ]; then
            git config user.name  "instabox-keeper-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "state: $(date -u +%FT%TZ)"
            git push
          else
            echo "state unchanged"
          fi
